# =============================================================================
#  Build and publish Lyst container images to GitHub Container Registry
# =============================================================================
#  Triggers
#    - push to main          → tags: latest, sha-<short>, main
#    - tag push v1.2.3       → tags: 1.2.3, 1.2, latest, sha-<short>
#    - pull request          → builds (multi-arch) but does NOT push
#    - manual workflow_dispatch
#
#  Images
#    ghcr.io/<owner>/lyst-backend
#    ghcr.io/<owner>/lyst-frontend
#
#  Architectures: linux/amd64, linux/arm64
#  arm64 runs under QEMU emulation on ubuntu-latest — fine for releases,
#  noticeably slower than native. Switch to a matrix-of-runners setup if
#  build time becomes a problem.
# =============================================================================

name: Build and publish Docker images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires lowercase image paths; org/user logins are stored with
      # the original case, so normalise once and reuse.
      - name: Compute owner (lowercase)
        id: owner
        run: echo "value=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/lyst-${{ matrix.service }}
          # Combined output:
          #   - branch / PR refs (for traceability)
          #   - semver tags from v1.2.3 → 1.2.3 + 1.2
          #   - `latest` only on the default branch and on release tags
          #   - short SHA on every push so a specific commit is pinnable
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Don't push on PRs — builds still run as a smoke test, but the
          # registry stays clean of fork noise.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Buildx GHA cache scoped per-service so the two matrix legs
          # don't trample each other.
          cache-from: type=gha,scope=lyst-${{ matrix.service }}
          cache-to: type=gha,scope=lyst-${{ matrix.service }},mode=max
          provenance: false
