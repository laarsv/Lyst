name: Feature request
description: Suggest a new feature or improvement for Lyst
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature! The most useful
        proposals lead with the **problem** you're trying to solve, not the
        solution — that often surfaces a simpler approach than the one you
        started from. Please search existing issues and discussions before
        opening a new one.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the user pain or scenario without referring to a specific
        implementation yet. "I can't quickly tell which items in a packing
        list are still missing" is more useful than "Add a missing-items
        counter".
      placeholder: When I do X, the friction is Y. It would help if Z were possible.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: |
        How would you like Lyst to solve this? Sketches, mockups, or
        rough wording for new UI text are very welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Other approaches you thought about and why you didn't pick them.
        Saying "none — first idea I had" is fine; it just helps reviewers
        know not to keep searching.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area of the app
      description: Roughly which feature area does this touch?
      multiple: true
      options:
        - Lists (shopping, packing, checklist, custom)
        - Templates
        - Notes (markdown, folders, tags, version history)
        - Recipes (import, scaling, cook mode)
        - Meal planner
        - Sharing & collaboration (real-time, public links)
        - Reminders / email
        - AI (Ollama / Anthropic)
        - PWA / offline
        - Admin & user management
        - Backend / API
        - Build / deployment / docs
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: |
        Screenshots, links to similar features in other apps, related
        issues, or anything else that helps frame the request.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks before submitting
      options:
        - label: I searched existing issues and discussions and this isn't already proposed.
          required: true
        - label: I'd be willing to discuss/refine this if a maintainer asks follow-up questions.
          required: true
