# =============================================================================
#  Lyst — production stack
# =============================================================================
#  Edit .env (copy from .env.example), then:    docker compose up -d
#
#  Local development overrides live in docker-compose.dev.yml — bring them in
#  with:                                         docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# =============================================================================

# Shared logging policy: rotate at 10 MB, keep 3 files. Keeps disk usage
# bounded on long-running self-hosted boxes where nobody remembers to look.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lyst}
    volumes:
      - lyst-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lyst}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Bind only to loopback so Postgres is not exposed to the LAN.
    # Backend reaches it via the internal Docker network as `db:5432`.
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-lyst}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lyst}}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8091}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:8091}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@lyst.local}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD must be set in .env}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Admin}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-${OLLAMA_MODEL:-llama3.1:8b}}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava:7b}
      OLLAMA_TEXT_KEEP_ALIVE: ${OLLAMA_TEXT_KEEP_ALIVE:--1}
      OLLAMA_VISION_KEEP_ALIVE: ${OLLAMA_VISION_KEEP_ALIVE:-1h}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      FDC_API_KEY: ${FDC_API_KEY:-}
      LYST_PICNIC_IMPORT_OWNER_EMAIL: ${LYST_PICNIC_IMPORT_OWNER_EMAIL:-}
      LYST_INTEGRATION_API_KEY: ${LYST_INTEGRATION_API_KEY:-}
    # Lets the backend reach services that are exposed on the host's published
    # ports (e.g. an Ollama instance running on the host) via the hostname
    # `host.docker.internal`. Required on Linux/Proxmox-LXC; Docker Desktop
    # adds this automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # User-uploaded files (recipe hero images, …). Bind to a host path
      # so backups survive container rebuilds. Override via UPLOADS_DIR
      # in .env — defaults to a sibling `./uploads/` for dev simplicity.
      - ${UPLOADS_DIR:-./uploads}:/app/uploads
    # No port mapping — the frontend's nginx reaches backend:8000 over the
    # internal Docker network. To debug the API directly from the host, add:
    #   ports: ["127.0.0.1:8000:8000"]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      # Wait for the backend's HEALTHCHECK so nginx isn't serving a 502
      # window during the very first cold start. After that, restart loops
      # are decoupled — nginx will lazy-resolve `backend` again.
      backend:
        condition: service_started
    ports:
      # Host port 8091 → nginx-unprivileged on 8080 inside the container.
      # Bind to all interfaces so a remote reverse proxy (NPM/Caddy/Traefik
      # on another host) can reach it. Switch to "127.0.0.1:8091:8080" if
      # your reverse proxy lives on the same machine.
      - "8091:8080"

volumes:
  lyst-db-data:
