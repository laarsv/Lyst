services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lyst}
      POSTGRES_DB: ${POSTGRES_DB:-lyst}
    volumes:
      - lyst-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lyst}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Bind only to loopback so Postgres is not exposed to the LAN.
    # Backend reaches it via the internal Docker network as `db:5432`.
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lyst}:${POSTGRES_PASSWORD:-lyst}@db:5432/${POSTGRES_DB:-lyst}
      SECRET_KEY: ${SECRET_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Admin}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
    # Lets the backend reach services that are exposed on the host's published
    # ports (e.g. an Ollama container running on this host) via the hostname
    # `host.docker.internal`. Required on Linux/Proxmox-LXC; on Docker Desktop
    # (Mac/Windows) this name is built-in.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Backend is reached via the frontend container's nginx (`/api/` → backend:8000)
    # over the internal Docker network. No external port mapping is needed.
    # If you want to debug the API directly from the host, add:
    #   ports: ["127.0.0.1:8000:8000"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8091:80"

volumes:
  lyst-db-data:
