server {
    # Port matches nginx-unprivileged's default — see frontend/Dockerfile.
    # docker-compose.yml maps the host port → 8080 here.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Photo uploads (recipe hero image, photo import, multi-photo import) can be
    # several MB each. Without this, nginx's 1 MB default rejects them with 413
    # before they ever reach the backend (which allows up to 10 MB per image).
    # 50m leaves headroom for the multi-photo import (a few images per request).
    client_max_body_size 50m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker should not be cached aggressively
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /registerSW.js { add_header Cache-Control "no-cache"; }

    # Hashed Vite assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API to backend.
    # Use Docker's embedded DNS (127.0.0.11) and resolve the upstream lazily
    # via a variable, so nginx does not crash on startup if the backend
    # container is not yet (or temporarily not) reachable. A failed proxy
    # then surfaces as 502 instead of killing the whole nginx process.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket endpoint for live list collaboration. Needs the Upgrade
    # handshake plus a long read timeout — connections are intentionally
    # held open by the client.
    location /ws/ {
        set $upstream_backend backend:8000;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # User-uploaded files (recipe images, …) served by the backend's
    # StaticFiles mount. Same lazy-resolved upstream pattern as /api/.
    location /static/ {
        set $upstream_backend backend:8000;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Images can stay cached for a day — the URL changes (uuid filename)
        # whenever the user replaces the image, so cache invalidation is
        # implicit.
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location /api/ {
        set $upstream_backend backend:8000;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        # The recipe importer triggers an Ollama call that on slow / cold
        # 7B-on-CPU setups can comfortably take > 60s. Without these the
        # nginx defaults (60s) would kill the upstream and surface a 504
        # in the browser long before the backend's own Ollama timeout.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
