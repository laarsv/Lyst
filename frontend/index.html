<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- PWA manifest. vite-plugin-pwa generates /manifest.webmanifest from the
         config in vite.config.ts; linking it explicitly so Chrome recognises
         the site as installable on the very first load (auto-injection
         sometimes races the install-criteria check). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00c896" />
    <!-- iOS PWA: standalone display + status bar style -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lyst" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Lyst</title>
  </head>
  <body class="bg-page text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
