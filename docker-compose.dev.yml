# =============================================================================
#  Lyst — local development overrides
# =============================================================================
#  Bring up with:
#    docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
#  What this gives you on top of the production stack:
#    - backend reloads on file change (uvicorn --reload + bind mount)
#    - backend exposed on 127.0.0.1:8000 so a host-side `npm run dev`
#      (frontend on the host, not in Docker) can hit /api directly
#    - frontend service replaced with a vite dev server on :5173, with
#      its /api proxy pointed at the backend container
#    - postgres exposed at 127.0.0.1:5432 (already true in prod, kept here
#      explicitly for clarity)
#
#  Pick whichever frontend workflow you prefer:
#    A) Containerised vite — leave the frontend block below as-is.
#    B) Host-side vite     — comment out the frontend block and run
#                            `npm run dev` in ./frontend on your host;
#                            it'll proxy /api to 127.0.0.1:8000.
# =============================================================================

services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    # Live-reload by mounting the source tree over the image's /app. The
    # already-installed site-packages inside the image are still used; only
    # the `app/` and `alembic/` trees are overlaid from the host.
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    # Override CMD so uvicorn watches for changes. tini stays as ENTRYPOINT.
    command:
      - sh
      - -c
      - >
        alembic upgrade head &&
        python -m app.seed &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
        --reload-dir /app/app --reload-dir /app/alembic

  frontend:
    # Drop the production nginx image — use a plain node base so we can run
    # `vite dev` against the bind-mounted source.
    image: node:20-alpine
    working_dir: /app
    depends_on:
      backend:
        condition: service_started
    environment:
      # Tells vite.config.ts to proxy /api at the sibling backend service
      # instead of localhost (vite runs in this container now).
      BACKEND_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      # Anonymous volume so the host's missing/mismatched node_modules
      # doesn't shadow the install we do at container start. Re-runs of
      # `up` skip reinstall when package.json hasn't changed.
      - /app/node_modules
    ports:
      - "5173:5173"
    command:
      - sh
      - -c
      - npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173
